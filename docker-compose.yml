version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: citycare_backend
    restart: always
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=prod-secret-citycare-hospital-pos-kenya-2026-strong
      - JWT_SECRET_KEY=prod-jwt-secret-citycare-hospital-pos-kenya-2026-strong
      - DATABASE_URL=mysql+pymysql://citycare_user:citycare_pass_2026@db:3306/citycare_hospital_db
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: citycare_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_password_2026
      MYSQL_DATABASE: citycare_hospital_db
      MYSQL_USER: citycare_user
      MYSQL_PASSWORD: citycare_pass_2026
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
